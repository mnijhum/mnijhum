name: Update profile cards

on:
  schedule:
    - cron: "17 5 * * *" # daily, shortly after midnight in Montréal
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        run: python3 scripts/generate_cards.py
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Update profile cards"
            git push
          fi
